[package]
name = "chainfile"
authors = ["St. Jude Rust Labs"]
version = "0.4.0"
description = "A crate for working with genomics chain files."
license = "Apache-2.0/MIT"
homepage = "https://github.com/stjude-rust-labs/chainfile"
repository = "https://github.com/stjude-rust-labs/chainfile"
documentation = "https://docs.rs/chainfile"
edition = "2021"
rust-version = "1.91.0"

[workspace]
members = ["tools/chainfile-compare", "tools/chainfile-generate"]

[dependencies]
omics = { version = "0.4.0", features = ["coordinate", "position-u64"] }
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
clap-verbosity-flag = { version = "3.0.4", optional = true }
flate2 = "1.1.11"
memchr = { version = "2.8.3", optional = true }
nonempty = "0.12.0"
noodles = { version = "0.119.0", features = ["bed", "core", "fasta", "vcf"], optional = true }
regex = "1.13.1"
rust-lapper = "2.0.1"
thiserror = "2.0.21"
tracing = { version = "0.1.44", optional = true }
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
], optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
rand = "0.10.3"
tempfile = "3.27.0"

[features]
default = []
cli = [
    "dep:anyhow",
    "dep:clap",
    "dep:clap-verbosity-flag",
    "dep:memchr",
    "dep:noodles",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[[bin]]
name = "chainfile"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[[bench]]
name = "machine"
harness = false

[[bench]]
name = "liftover"
harness = false

[[bench]]
name = "end_to_end"
harness = false
