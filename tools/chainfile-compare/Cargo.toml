[package]
name = "chainfile-compare"
authors = ["St. Jude Rust Labs"]
version = "0.1.0"
description = "Compares `chainfile` liftover results with other liftover tools."
license = "Apache-2.0/MIT"
edition = "2021"
rust-version = "1.91.0"
publish = false

[dependencies]
anyhow = "1.0.104"
chainfile-generate = { path = "../chainfile-generate" }
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.10.3"
tempfile = "3.27.0"
